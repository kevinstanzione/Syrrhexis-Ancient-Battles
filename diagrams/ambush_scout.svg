<text x="262.0" y="288.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="292.5" y="288.0" font-size="5" fill="#2b2b2b" text-anchor="middle">6"</text>
<text x="323.0" y="288.0" font-size="5" fill="#2b2b2b" text-anchor="middle">12"</text>
<text x="4" y="313" font-size="8" font-weight="bold" fill="#2b2b2b">Scout and Ambush</text>
<text x="4" y="324" font-size="6" fill="#2b2b2b">Scouting and Ambushing units deploy after everyone else, and never in their own deployment zone. A</text>
<text x="4" y="332" font-size="6" fill="#2b2b2b">Scout may be placed anywhere else as long as it is not within 12” of an enemy model. An Ambusher may</text>
<text x="4" y="340" font-size="6" fill="#2b2b2b">be placed anywhere else as long as it is within 12” of an enemy unit. Scouts deploy before</text>
<text x="4" y="348" font-size="6" fill="#2b2b2b">Ambushers, so an Ambush can answer where the Scouts went.</text>
