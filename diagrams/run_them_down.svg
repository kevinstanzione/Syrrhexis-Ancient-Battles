<text x="412.0" y="180.0" font-size="5.2" fill="#b4473a" text-anchor="middle" font-style="italic">each picks the closest enemy it can see</text>
<text x="4" y="203" font-size="8" font-weight="bold" fill="#2b2b2b">Run Them Down</text>
<text x="4" y="214" font-size="6" fill="#2b2b2b">The first time a unit with Run Them Down charges or is charged, at the end of that Combat Phase it splits up: every model becomes its own Open</text>
<text x="4" y="222" font-size="6" fill="#2b2b2b">Order unit. From then on, each one must declare a Charge against the closest enemy unit it can see at the start of its activation, or Run toward</text>
<text x="4" y="230" font-size="6" fill="#2b2b2b">it if it cannot reach. They cannot Hold, Flee or Rally. Elephants target the closest unit, friend or foe.</text>
