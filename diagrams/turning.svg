<text x="212.0" y="74.0" font-size="6" fill="#b4473a" text-anchor="start" font-weight="bold">1” of Move</text>
<text x="212.0" y="82.0" font-size="5.5" fill="#b4473a" text-anchor="start" font-style="italic">(+X” Unwieldy)</text>
<text x="182.0" y="62.0" font-size="5.5" fill="#b4473a" text-anchor="middle" font-style="italic">Start</text>
<text x="88.0" y="140.0" font-size="6" fill="#b4473a" text-anchor="end" font-weight="bold">After a full 45° turn:</text>
<text x="88.0" y="148.0" font-size="5.5" fill="#b4473a" text-anchor="end" font-style="italic">flank flush with the arm</text>
<text x="104.0" y="44.0" font-size="5.5" fill="#2b2b2b" text-anchor="end" font-style="italic">corner</text>
<rect x="240.0" y="148" width="25.4" height="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="0.5"/>
<rect x="265.4" y="148" width="25.4" height="3" fill="#fff" stroke="#2b2b2b" stroke-width="0.5"/>
<text x="240.0" y="146.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="265.4" y="146.0" font-size="5" fill="#2b2b2b" text-anchor="middle">1"</text>
<text x="290.8" y="146.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="173" font-size="8" font-weight="bold" fill="#2b2b2b">Turning with the Turn Template</text>
<text x="4" y="184" font-size="6" fill="#2b2b2b">The Turn Template is two 3.5” arms meeting at 135°. Put its corner at a front corner of</text>
<text x="4" y="192" font-size="6" fill="#2b2b2b">the tray, with the front edge flush against one arm, then turn the unit backwards around</text>
<text x="4" y="200" font-size="6" fill="#2b2b2b">that corner. After a full 45° turn, the unit’s flank is flush with the other arm; it may</text>
<text x="4" y="208" font-size="6" fill="#2b2b2b">stop sooner for a smaller turn. Each turn costs 1” of Move, plus X” for Unwieldy (X). A</text>
<text x="4" y="216" font-size="6" fill="#2b2b2b">unit may keep turning the same way for 1” per turn, but must move forward at least 1”</text>
<text x="4" y="224" font-size="6" fill="#2b2b2b">before turning the other way.</text>
</svg>