<text x="33.4" y="161.0" font-size="5" fill="#2b2b2b" text-anchor="middle">1"</text>
<text x="58.8" y="161.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="188" font-size="8" font-weight="bold" fill="#2b2b2b">Turning with the Turn Template</text>
<text x="4" y="199" font-size="6" fill="#2b2b2b">Put the template’s point at a front corner of the tray, one arm along the front edge,</text>
<text x="4" y="207" font-size="6" fill="#2b2b2b">and turn the unit backwards around that corner. A turn may be any angle up to 45°</text>
<text x="4" y="215" font-size="6" fill="#2b2b2b">(notches mark 15° and 30°) and costs 1” of Move, plus X” for Unwieldy (X). A unit may</text>
<text x="4" y="223" font-size="6" fill="#2b2b2b">keep turning the same way for 1” per turn, but must move forward at least 1” before</text>
<text x="4" y="231" font-size="6" fill="#2b2b2b">turning the other way.</text>
