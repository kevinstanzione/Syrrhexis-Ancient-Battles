<text x="300.0" y="174.7" font-size="5.2" fill="#b4473a" text-anchor="start" font-weight="bold">at the wall</text>
<text x="261.0" y="235.0" font-size="5.2" fill="#2b2b2b" text-anchor="middle" font-weight="bold">Locked in Combat across the wall;</text>
<text x="261.0" y="242.0" font-size="5.2" fill="#2b2b2b" text-anchor="middle" font-weight="bold">the Charge is broken</text>
<rect x="8.0" y="224" width="25.4" height="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="0.5"/>
<rect x="33.4" y="224" width="25.4" height="3" fill="#fff" stroke="#2b2b2b" stroke-width="0.5"/>
<text x="8.0" y="222.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="33.4" y="222.0" font-size="5" fill="#2b2b2b" text-anchor="middle">1"</text>
<text x="58.8" y="222.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="263" font-size="8" font-weight="bold" fill="#2b2b2b">Crossing and Defending a Wall</text>
<text x="4" y="274" font-size="6" fill="#2b2b2b">Left: a Warrior or Cavalry unit crosses a wall with a Standard Move or Run, using half its Move</text>
<text x="4" y="282" font-size="6" fill="#2b2b2b">Allowance, and must end the move entirely clear of the wall. It cannot cross during a Charge, Flee or</text>
<text x="4" y="290" font-size="6" fill="#2b2b2b">Disengage, and Chariots, Elephants and Warmachines cannot cross at all. Right: the attacker charges a</text>
<text x="4" y="298" font-size="6" fill="#2b2b2b">unit standing behind the wall. It stops when it touches the wall, and the defender is drawn up to</text>
<text x="4" y="306" font-size="6" fill="#2b2b2b">defend it, moving straight forward until it touches the wall. They fight across the wall, and the</text>
<text x="4" y="314" font-size="6" fill="#2b2b2b">Charge is broken: no +1 Strength from the Charge Action Token, no Collision, and no weapons that may</text>
<text x="4" y="322" font-size="6" fill="#2b2b2b">only be used on the Charge.</text>
</svg>