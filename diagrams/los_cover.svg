<text x="4" y="243" font-size="8" font-weight="bold" fill="#2b2b2b">Line of Sight and Cover</text>
<text x="4" y="254" font-size="6" fill="#2b2b2b">Dense Brush hides 4 of the target’s 10 models, so 60% of the defending unit is seen (the ≥50% row).</text>
<text x="4" y="262" font-size="6" fill="#2b2b2b">Each archer checks whether it can see at least half the target; only terrain and units in between</text>
<text x="4" y="270" font-size="6" fill="#2b2b2b">block its view. The two left-hand files are blocked, so 6 of 8 (75%) can see (the ≥50% column). The</text>
<text x="4" y="278" font-size="6" fill="#2b2b2b">table gives Cover. Because battlefield objects cause it, the archers lose half their shooting</text>
<text x="4" y="286" font-size="6" fill="#2b2b2b">attacks and suffer -1 Accuracy.</text>
