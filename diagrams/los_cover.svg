<line x1="170" y1="185" x2="95" y2="45" stroke="#2b2b2b" stroke-width="0.8"/>
<line x1="170" y1="185" x2="245" y2="45" stroke="#6b6253" stroke-width="0.8" stroke-dasharray="2 2"/>
<circle cx="170" cy="185" r="1.8" fill="#2b2b2b"/>
<circle cx="95" cy="45" r="1.8" fill="#2b2b2b"/>
<circle cx="245" cy="45" r="1.8" fill="#2b2b2b"/>
<text x="100.0" y="77.0" font-size="5.5" fill="#2b2b2b" text-anchor="end" font-weight="bold">Cover: -2 Accuracy</text>
<text x="240.0" y="77.0" font-size="5.5" fill="#6b6253" text-anchor="start" font-weight="bold">Blocked: cannot shoot</text>
<rect x="280.0" y="218" width="25.4" height="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="0.5"/>
<rect x="305.4" y="218" width="25.4" height="3" fill="#fff" stroke="#2b2b2b" stroke-width="0.5"/>
<text x="280.0" y="216.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="305.4" y="216.0" font-size="5" fill="#2b2b2b" text-anchor="middle">1"</text>
<text x="330.8" y="216.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="243" font-size="8" font-weight="bold" fill="#2b2b2b">Line of Fire and Cover</text>
<text x="4" y="254" font-size="6" fill="#2b2b2b">The archers trace a line of fire from the centre of their tray to the centre of each target’s tray.</text>
<text x="4" y="262" font-size="6" fill="#2b2b2b">The line to Target A crosses a Phocian Wall, which gives Cover: the archers shoot at -2 Accuracy.</text>
<text x="4" y="270" font-size="6" fill="#2b2b2b">The line to Target B crosses Dense Brush, which blocks Line of Sight, so the archers cannot shoot</text>
<text x="4" y="278" font-size="6" fill="#2b2b2b">Target B at all, even though some of its models stick out past the brush. Only the line matters, not</text>
<text x="4" y="286" font-size="6" fill="#2b2b2b">how much of the target the archers can see.</text>
