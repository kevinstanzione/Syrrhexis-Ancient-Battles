<rect x="94.75" y="105.0" width="68" height="6" fill="#bdb4a2" stroke="#6b6253" stroke-width="0.8"/>
<text x="90.8" y="110.0" font-size="5.5" fill="#6b6253" text-anchor="end" font-style="italic">Phocian Wall: Cover</text>
<rect x="189.25" y="96.0" width="44" height="24" rx="8" fill="#4f7f4a" fill-opacity="0.55" stroke="#4f7f4a" stroke-width="0.9"/>
