<text x="4" y="243" font-size="8" font-weight="bold" fill="#2b2b2b">Pile In with Open Order Units</text>
<text x="4" y="254" font-size="6" fill="#2b2b2b">Open Order models pile in and Closed Order trays stay put. Each model moves up to twice its Move to get into base contact,</text>
<text x="4" y="262" font-size="6" fill="#2b2b2b">and against a Closed Order unit it may only touch one side of it. Left: Open Order attackers pile in along the Destination</text>
<text x="4" y="270" font-size="6" fill="#2b2b2b">edge they charged, after the Leader’s charge move. Right: the Open Order defender’s models pile in along the attacker’s front</text>
<text x="4" y="278" font-size="6" fill="#2b2b2b">edge. Faded bases are start positions.</text>
</svg>