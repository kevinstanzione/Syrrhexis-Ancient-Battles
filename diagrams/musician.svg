<text x="4" y="183" font-size="8" font-weight="bold" fill="#2b2b2b">The Musician’s Special Move</text>
<text x="4" y="194" font-size="6" fill="#2b2b2b">At the end of its Movement Step, a unit with a Musician that has no Action Token and is not Locked in Combat may make a</text>
<text x="4" y="202" font-size="6" fill="#2b2b2b">Special Move. A Closed Order unit shifts 1” straight forward, back, left or right without changing facing, or turns</text>
<text x="4" y="210" font-size="6" fill="#2b2b2b">once. An Open Order unit moves 1” by the quickest route toward or away from the enemy side of the board. It may not</text>
<text x="4" y="218" font-size="6" fill="#2b2b2b">begin or end within 1” of an enemy.</text>
