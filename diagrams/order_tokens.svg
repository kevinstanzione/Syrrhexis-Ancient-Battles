<text x="4" y="183" font-size="8" font-weight="bold" fill="#2b2b2b">Order Tokens and Pass Tokens</text>
<text x="4" y="194" font-size="6" fill="#2b2b2b">In the Orders Phase each player takes one numbered Order Token per Active Unit and places them</text>
<text x="4" y="202" font-size="6" fill="#2b2b2b">face-down on their units, in Initiative order, hiding which unit will activate first. A player</text>
<text x="4" y="210" font-size="6" fill="#2b2b2b">with fewer Active Units than the player with the most takes one Pass Token per unit of</text>
<text x="4" y="218" font-size="6" fill="#2b2b2b">difference. Pass Tokens sit face-down in view of all players and are flipped face-up as they are</text>
<text x="4" y="226" font-size="6" fill="#2b2b2b">used.</text>
</svg>