<text x="4" y="158" font-size="8" font-weight="bold" fill="#2b2b2b">Break Tokens and Break Tests</text>
<text x="4" y="169" font-size="6" fill="#2b2b2b">Break Tokens come from Terrify, charges into a flank or rear, and other effects. In the Morale</text>
<text x="4" y="177" font-size="6" fill="#2b2b2b">Phase, a unit with any Break Tokens rolls 1d6 + Training, at -1 for each Break Token after the</text>
<text x="4" y="185" font-size="6" fill="#2b2b2b">first, and needs 7 or more. If it passes, it removes 1 Break Token, or all of them if it was not</text>
<text x="4" y="193" font-size="6" fill="#2b2b2b">Locked in Combat and took no Damage this round. If it fails, its Action and Break Tokens are</text>
<text x="4" y="201" font-size="6" fill="#2b2b2b">replaced with a Flee Token.</text>
