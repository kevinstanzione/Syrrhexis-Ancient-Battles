<g transform="translate(127.0,38.0)"><polygon points="0.00,-7.50 6.50,3.75 -6.50,3.75" fill="#9e2f2b" stroke="#5a1714" stroke-width="0.9" stroke-linejoin="round"/><path d="M0,-4.50 l-1.32,2.70 l1.80,0.72 l-1.50,3.30" fill="none" stroke="#f3d9d4" stroke-width="0.78" stroke-linejoin="round"/></g>
<g transform="translate(142.0,38.0)"><polygon points="0.00,-7.50 6.50,3.75 -6.50,3.75" fill="#9e2f2b" stroke="#5a1714" stroke-width="0.9" stroke-linejoin="round"/><path d="M0,-4.50 l-1.32,2.70 l1.80,0.72 l-1.50,3.30" fill="none" stroke="#f3d9d4" stroke-width="0.78" stroke-linejoin="round"/></g>
<text x="205.0" y="36.0" font-size="6.5" fill="#2b2b2b" text-anchor="start" font-weight="bold">Test: 1d6 + 6 - 2 ≥ 7</text>
<text x="205.0" y="46.0" font-size="5.5" fill="#6b6253" text-anchor="start" font-style="italic">so a roll of 3 or more passes</text>
<text x="205.0" y="70.0" font-size="6" fill="#4f7f4a" text-anchor="start" font-weight="bold">Pass:</text>
<text x="226.0" y="70.0" font-size="5.5" fill="#2b2b2b" text-anchor="start">remove all Break Tokens</text>
<text x="205.0" y="92.0" font-size="6" fill="#b4473a" text-anchor="start" font-weight="bold">Fail:</text>
<text x="226.0" y="92.0" font-size="5.5" fill="#2b2b2b" text-anchor="start">remove its Action and</text>
<text x="226.0" y="99.0" font-size="5.5" fill="#2b2b2b" text-anchor="start">Break Tokens, add Flee</text>
<g transform="translate(306.0,82.0)"><polygon points="0,-8 10.0,0 0,8 -10.0,0" fill="#ecdcae" stroke="#9b8452" stroke-width="1"/><polygon points="0,-6.24 7.84,0 0,6.24 -7.84,0" fill="none" stroke="#9b8452" stroke-width="0.4"/><text x="0" y="1.18" font-size="3.36" fill="#9b8452" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">FLEE</text></g>
<text x="4" y="138" font-size="8" font-weight="bold" fill="#2b2b2b">Break Tokens and Break Tests</text>
<text x="4" y="149" font-size="6" fill="#2b2b2b">Break Tokens come from Terrify, charges into a flank or rear, and other effects. In the Morale</text>
<text x="4" y="157" font-size="6" fill="#2b2b2b">Phase, a unit with any Break Tokens rolls 1d6 + Training, at -1 for each Break Token after the</text>
<text x="4" y="165" font-size="6" fill="#2b2b2b">first, and needs 7 or more. If it passes, all its Break Tokens are removed. If it fails, its</text>
<text x="4" y="173" font-size="6" fill="#2b2b2b">Action and Break Tokens are replaced with a Flee Token.</text>
</svg>