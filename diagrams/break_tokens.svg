<text x="11.0" y="16.0" font-size="7" fill="#2b2b2b" text-anchor="start" font-weight="bold">Break Token</text>
<g transform="translate(41.0,50.0)"><polygon points="0.00,-17.50 15.16,8.75 -15.16,8.75" fill="#9e2f2b" stroke="#5a1714" stroke-width="0.9" stroke-linejoin="round"/><path d="M0,-10.50 l-3.08,6.30 l4.20,1.68 l-3.50,7.70" fill="none" stroke="#f3d9d4" stroke-width="1.82" stroke-linejoin="round"/></g>
