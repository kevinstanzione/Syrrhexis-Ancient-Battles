<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 194" width="792" height="466" font-family="Georgia, 'Times New Roman', serif">
<defs><marker id="arrow_b4473a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b4473a"/></marker></defs>
<rect width="330" height="194" fill="#fff"/>
<rect x="0" y="0" width="330" height="150" fill="#f6f1e6" stroke="#6b6253" stroke-width="0.8"/>
<rect x="6" y="6" width="100" height="138" fill="#f6f1e6" stroke="#6b6253" stroke-width="0.8"/>
<text x="11.0" y="16.0" font-size="7" fill="#2b2b2b" text-anchor="start" font-weight="bold">Hold / Flee</text>
<g transform="translate(56.0,42.0)"><polygon points="0,-12 15.0,0 0,12 -15.0,0" fill="#ecdcae" stroke="#9b8452" stroke-width="1"/><polygon points="0,-9.36 11.76,0 0,9.36 -11.76,0" fill="none" stroke="#9b8452" stroke-width="0.4"/><text x="0" y="1.76" font-size="5.04" fill="#9b8452" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">HOLD</text></g>
<text x="56.0" y="64.0" font-size="5" fill="#6b6253" text-anchor="middle" font-style="italic">+1 Accuracy, cannot move</text>
<line x1="56.0" y1="69.0" x2="56.0" y2="85.0" stroke="#b4473a" stroke-width="1.1" marker-end="url(#arrow_b4473a)"/>
<text x="60.0" y="79.0" font-size="4.8" fill="#b4473a" text-anchor="start" font-style="italic">flip</text>
<g transform="translate(56.0,100.0)"><polygon points="0,-12 15.0,0 0,12 -15.0,0" fill="#ecdcae" stroke="#9b8452" stroke-width="1"/><polygon points="0,-9.36 11.76,0 0,9.36 -11.76,0" fill="none" stroke="#9b8452" stroke-width="0.4"/><text x="0" y="1.76" font-size="5.04" fill="#9b8452" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">FLEE</text></g>
<text x="56.0" y="122.0" font-size="5" fill="#6b6253" text-anchor="middle" font-style="italic">must Rally or Flee</text>
<rect x="112" y="6" width="100" height="138" fill="#f6f1e6" stroke="#6b6253" stroke-width="0.8"/>
<text x="117.0" y="16.0" font-size="7" fill="#2b2b2b" text-anchor="start" font-weight="bold">Charge / Run</text>
<g transform="translate(162.0,42.0)"><circle r="11" fill="#cf8f55" stroke="#7a4a22" stroke-width="1"/><circle r="8.58" fill="none" stroke="#7a4a22" stroke-width="0.4"/><text x="0" y="1.15" font-size="3.3" fill="#fff8ec" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">CHARGE</text></g>
<text x="162.0" y="64.0" font-size="5" fill="#6b6253" text-anchor="middle" font-style="italic">+1 Strength, cannot shoot</text>
<line x1="162.0" y1="69.0" x2="162.0" y2="85.0" stroke="#b4473a" stroke-width="1.1" marker-end="url(#arrow_b4473a)"/>
<text x="166.0" y="79.0" font-size="4.8" fill="#b4473a" text-anchor="start" font-style="italic">flip</text>
<g transform="translate(162.0,100.0)"><circle r="11" fill="#cf8f55" stroke="#7a4a22" stroke-width="1"/><circle r="8.58" fill="none" stroke="#7a4a22" stroke-width="0.4"/><text x="0" y="1.62" font-size="4.62" fill="#fff8ec" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">RUN</text></g>
<text x="162.0" y="122.0" font-size="5" fill="#6b6253" text-anchor="middle" font-style="italic">-1 Strength, cannot shoot</text>
<rect x="218" y="6" width="106" height="138" fill="#f6f1e6" stroke="#6b6253" stroke-width="0.8"/>
<text x="223.0" y="16.0" font-size="7" fill="#2b2b2b" text-anchor="start" font-weight="bold">Standard Move</text>
<circle cx="270" cy="70" r="12" fill="none" stroke="#6b6253" stroke-width="0.9" stroke-dasharray="2 2"/>
<text x="270.0" y="72.0" font-size="5.5" fill="#6b6253" text-anchor="middle" font-style="italic">none</text>
<text x="270.0" y="96.0" font-size="5.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold">no Action Token</text>
<text x="270.0" y="104.0" font-size="5" fill="#6b6253" text-anchor="middle" font-style="italic">(any old token is removed)</text>
<text x="4" y="163" font-size="8" font-weight="bold" fill="#2b2b2b">Action Tokens</text>
<text x="4" y="174" font-size="6" fill="#2b2b2b">Every action except Standard Move gives the unit an Action Token, placed beside it. Hold and Flee</text>
<text x="4" y="182" font-size="6" fill="#2b2b2b">share one diamond token, and Charge and Run share one round token, flipped to the side that</text>
<text x="4" y="190" font-size="6" fill="#2b2b2b">applies. A unit never has more than one Action Token.</text>
</svg>