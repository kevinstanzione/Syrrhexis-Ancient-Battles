<text x="4" y="183" font-size="8" font-weight="bold" fill="#2b2b2b">Removing Models at Half Strength</text>
<text x="4" y="194" font-size="6" fill="#2b2b2b">When a unit enters Half Strength it removes half its models, rounded down, starting from the</text>
<text x="4" y="202" font-size="6" fill="#2b2b2b">rear rank and working forward. Special Characters are never removed: if one would be, remove</text>
<text x="4" y="210" font-size="6" fill="#2b2b2b">another model instead and move the character into its place. Here a unit of 20 removes 10. Its</text>
<text x="4" y="218" font-size="6" fill="#2b2b2b">Standard Bearer, in the rear rank, moves forward into the second rank.</text>
