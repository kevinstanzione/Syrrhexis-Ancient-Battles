<text x="4" y="213" font-size="8" font-weight="bold" fill="#2b2b2b">Measuring Distances</text>
<text x="4" y="224" font-size="6" fill="#2b2b2b">Distances are measured between the closest points of two units: the edge of a Closed Order unit’s tray, and the base of</text>
<text x="4" y="232" font-size="6" fill="#2b2b2b">whichever Open Order model is closest. A unit is within a distance if any part of it is, and wholly within only if every part</text>
<text x="4" y="240" font-size="6" fill="#2b2b2b">is.</text>
