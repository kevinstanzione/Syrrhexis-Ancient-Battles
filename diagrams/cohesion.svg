<text x="4" y="183" font-size="8" font-weight="bold" fill="#2b2b2b">Open Order Cohesion</text>
<text x="4" y="194" font-size="6" fill="#2b2b2b">An Open Order unit must end its activation in 1” Cohesion: every model within 1” of another model in the unit, in</text>
<text x="4" y="202" font-size="6" fill="#2b2b2b">a chain or a cluster. Each dashed halo reaches ½” beyond its base, so models whose halos touch are within 1” of</text>
<text x="4" y="210" font-size="6" fill="#2b2b2b">each other. On the right, one model’s halo touches no other, so the unit is out of Cohesion.</text>
