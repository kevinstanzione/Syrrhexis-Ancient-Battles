<text x="58.8" y="186.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="213" font-size="8" font-weight="bold" fill="#2b2b2b">Firing Angle</text>
<text x="4" y="224" font-size="6" fill="#2b2b2b">A Closed Order unit may only shoot at an enemy unit that is at least partly within its</text>
<text x="4" y="232" font-size="6" fill="#2b2b2b">firing arc: the area in front of its tray between two lines running out at 45° from its</text>
<text x="4" y="240" font-size="6" fill="#2b2b2b">front corners. Targets A and C are in the arc; Target B is level with the unit’s flank,</text>
<text x="4" y="248" font-size="6" fill="#2b2b2b">so the unit must turn to shoot it. Firing Angle never gives Cover: Target C, just 1”</text>
<text x="4" y="256" font-size="6" fill="#2b2b2b">away with nothing between them, has No Cover.</text>
