<text x="4" y="213" font-size="8" font-weight="bold" fill="#2b2b2b">Firing Angle</text>
<text x="4" y="224" font-size="6" fill="#2b2b2b">Each model in a Closed Order unit can only draw Line of Sight within a 90° arc out of</text>
<text x="4" y="232" font-size="6" fill="#2b2b2b">the front edge of its base. The shaded arcs show the two end models of the front rank.</text>
<text x="4" y="240" font-size="6" fill="#2b2b2b">Target A is inside the unit’s arcs and can be shot. Target B is level with the unit’s</text>
<text x="4" y="248" font-size="6" fill="#2b2b2b">flank and outside every model’s arc, so the unit must turn to shoot at it.</text>
