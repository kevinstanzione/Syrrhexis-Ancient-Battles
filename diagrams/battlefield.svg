<rect x="45" y="22" width="243.8" height="243.8" fill="#f6f1e6" stroke="#2b2b2b" stroke-width="1"/>
<line x1="45" y1="143.9" x2="288.8" y2="143.9" stroke="#6b6253" stroke-width="0.6" stroke-dasharray="1.5 2"/>
<rect x="45" y="22" width="243.8" height="61.0" fill="#3f6fb0" fill-opacity="0.13"/>
<rect x="45" y="204.9" width="243.8" height="61.0" fill="#b4473a" fill-opacity="0.13"/>
<rect x="45.0" y="22" width="61.0" height="243.8" fill="none" stroke="#9aa37a" stroke-width="0.8" stroke-dasharray="3 2"/>
<rect x="136.4" y="22" width="61.0" height="243.8" fill="#d8dcc0" fill-opacity="0.85" stroke="#9aa37a" stroke-width="0.9"/>
