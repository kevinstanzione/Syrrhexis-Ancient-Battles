<text x="4" y="228" font-size="8" font-weight="bold" fill="#2b2b2b">The Skirmish Captain</text>
<text x="4" y="239" font-size="6" fill="#2b2b2b">When an enemy declares a Charge against a unit with a Skirmish Captain, before measuring, it may take a Fear Test. If it passes, it</text>
<text x="4" y="247" font-size="6" fill="#2b2b2b">falls back directly away from the charger up to its Move, through friendly units if needed (not ending on or touching them, or within</text>
<text x="4" y="255" font-size="6" fill="#2b2b2b">1” of an enemy), and gains a Run Token. If the charger can no longer reach it, it may charge the first enemy unit in its path.</text>
