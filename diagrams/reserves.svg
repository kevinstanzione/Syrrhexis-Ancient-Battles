<text x="4" y="303" font-size="8" font-weight="bold" fill="#2b2b2b">Reserves</text>
<text x="4" y="314" font-size="6" fill="#2b2b2b">From the second round, a Reserve unit may enter along its Friendly board edge, or along either</text>
<text x="4" y="322" font-size="6" fill="#2b2b2b">Neutral edge within its own half of the battlefield (the thick red lines), never in the enemy’s</text>
<text x="4" y="330" font-size="6" fill="#2b2b2b">half. It then makes a standard move: not a Charge or a Run, since it has no Action Token yet, and</text>
<text x="4" y="338" font-size="6" fill="#2b2b2b">it cannot shoot. Reserves that have not arrived by the fourth round are destroyed.</text>
