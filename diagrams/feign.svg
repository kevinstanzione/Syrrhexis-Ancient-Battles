<text x="395.0" y="116.5" font-size="5.2" fill="#b4473a" text-anchor="start" font-style="italic">(8”) toward own zone</text>
<g transform="translate(311.0,147.1)"><circle r="7" fill="#cf8f55" stroke="#7a4a22" stroke-width="1"/><circle r="5.46" fill="none" stroke="#7a4a22" stroke-width="0.4"/><text x="0" y="1.03" font-size="2.94" fill="#fff8ec" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">RUN</text></g>
<text x="4" y="228" font-size="8" font-weight="bold" fill="#2b2b2b">Feign Charge and Feign Retreat</text>
<text x="4" y="239" font-size="6" fill="#2b2b2b">Both are declared instead of a Charge, before measuring, and need the target within the unit’s Move. The unit makes contact and the enemy</text>
<text x="4" y="247" font-size="6" fill="#2b2b2b">loses 1 Army Morale per warrior and 3 per cavalry model. Feign Charge: any Break Test happens now, then the unit turns about and moves up</text>
<text x="4" y="255" font-size="6" fill="#2b2b2b">to half its Move away, ending with a Charge Token. Feign Retreat: it turns about and moves its full Move toward its own deployment zone,</text>
<text x="4" y="263" font-size="6" fill="#2b2b2b">ending with a Run Token; the enemy then takes a special Break Test and, if goaded, moves its full Move after it.</text>
</svg>