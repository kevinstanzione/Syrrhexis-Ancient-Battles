<text x="230.6" y="10.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="276.3" y="10.0" font-size="5" fill="#2b2b2b" text-anchor="middle">6"</text>
<text x="322.0" y="10.0" font-size="5" fill="#2b2b2b" text-anchor="middle">12"</text>
<text x="4" y="238" font-size="8" font-weight="bold" fill="#2b2b2b">Fleeing and Rallying</text>
<text x="4" y="249" font-size="6" fill="#2b2b2b">In the Morale Phase, a unit with a Flee Token moves up to twice its Move toward its Friendly</text>
<text x="4" y="257" font-size="6" fill="#2b2b2b">board edge, as far as it can, and its player loses Army Morale equal to its Unit Strength. A</text>
<text x="4" y="265" font-size="6" fill="#2b2b2b">fleeing unit that touches its Friendly edge is removed, losing Army Morale equal to the base</text>
<text x="4" y="273" font-size="6" fill="#2b2b2b">Training of its remaining models. During its activation, a unit with a Hold Token may try to</text>
<text x="4" y="281" font-size="6" fill="#2b2b2b">Rally a fleeing friendly unit within 12”; a fleeing unit may also try to Rally itself.</text>
</svg>