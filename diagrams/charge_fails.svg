<rect x="8.0" y="354" width="25.4" height="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="0.5"/>
<rect x="33.4" y="354" width="25.4" height="3" fill="#fff" stroke="#2b2b2b" stroke-width="0.5"/>
<text x="8.0" y="352.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
<text x="33.4" y="352.0" font-size="5" fill="#2b2b2b" text-anchor="middle">1"</text>
<text x="58.8" y="352.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="383" font-size="8" font-weight="bold" fill="#2b2b2b">Charge Fails</text>
<text x="4" y="394" font-size="6" fill="#2b2b2b">Hattian Infantry (Move 6) would normally charge up to 12”, but they</text>
<text x="4" y="402" font-size="6" fill="#2b2b2b">start in Crumbled Ruins, which follow the rules for a Stony Plain, so</text>
<text x="4" y="410" font-size="6" fill="#2b2b2b">the whole Charge is limited to their Move of 6”. They need 7” to reach</text>
<text x="4" y="418" font-size="6" fill="#2b2b2b">the defender, so the Charge fails. They move directly forward as far</text>
<text x="4" y="426" font-size="6" fill="#2b2b2b">as they can, without coming within 1” of an enemy unit. Their Charge</text>
<text x="4" y="434" font-size="6" fill="#2b2b2b">Action Token becomes a Run Action Token, and their controlling player</text>
<text x="4" y="442" font-size="6" fill="#2b2b2b">loses Army Morale equal to their Unit Strength.</text>
</svg>