<rect x="33.4" y="318" width="25.4" height="3" fill="#fff" stroke="#2b2b2b" stroke-width="0.5"/>
<text x="8.0" y="316.0" font-size="5" fill="#2b2b2b" text-anchor="middle">0</text>
