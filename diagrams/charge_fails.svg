<text x="58.8" y="316.0" font-size="5" fill="#2b2b2b" text-anchor="middle">2"</text>
<text x="4" y="343" font-size="8" font-weight="bold" fill="#2b2b2b">Charge Fails</text>
<text x="4" y="354" font-size="6" fill="#2b2b2b">The attacker needs 7” to reach the Destination but has only 6” of Move</text>
<text x="4" y="362" font-size="6" fill="#2b2b2b">Allocation, so the Charge fails. It moves directly forward as far as</text>
<text x="4" y="370" font-size="6" fill="#2b2b2b">it can, without coming within 1” of an enemy unit or overlapping a</text>
<text x="4" y="378" font-size="6" fill="#2b2b2b">friendly unit. Its Charge Action Token becomes a Run Action Token, and</text>
<text x="4" y="386" font-size="6" fill="#2b2b2b">its controlling player loses Army Morale equal to its Unit Strength.</text>
