<line x1="195.1" y1="91.2" x2="195.1" y2="79.2" stroke="#3f6fb0" stroke-width="0.8"/><path d="M195.1,79.2 l7,3 l-7,3 z" fill="#3f6fb0"/>
<text x="4" y="263" font-size="8" font-weight="bold" fill="#2b2b2b">The Commander</text>
<text x="4" y="274" font-size="6" fill="#2b2b2b">At the end of an allied unit’s Movement Step, the Commander can order it to make a Special Move (1” shift or one turn for</text>
<text x="4" y="282" font-size="6" fill="#2b2b2b">Closed Order, 1” toward or away from the enemy side for Open Order), if it has no Action Token and is not Locked in Combat.</text>
<text x="4" y="290" font-size="6" fill="#2b2b2b">Measure from the Commander’s unit: the order fails beyond 6”, or beyond 18” if the chosen unit has a Standard Bearer. A</text>
<text x="4" y="298" font-size="6" fill="#2b2b2b">failed order gives a Run Token.</text>
</svg>