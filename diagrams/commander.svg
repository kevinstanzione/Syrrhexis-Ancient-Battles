<text x="248.1" y="20.0" font-size="6.2" fill="#2b2b2b" text-anchor="start" font-weight="bold">Ordering a unit</text>
<circle cx="253.1" cy="28.0" r="4.6" fill="#4f7f4a" stroke="#f6f1e6" stroke-width="1"/>
<text x="253.1" y="30.0" font-size="5.8" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<text x="261.1" y="30.0" font-size="5.4" fill="#2b2b2b" text-anchor="start" font-style="italic">3” away</text>
<text x="261.1" y="38.0" font-size="5.4" fill="#4f7f4a" text-anchor="start" font-weight="bold">Order succeeds.</text>
<circle cx="253.1" cy="50.0" r="4.6" fill="#b4473a" stroke="#f6f1e6" stroke-width="1"/>
<text x="253.1" y="52.0" font-size="5.8" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<text x="261.1" y="52.0" font-size="5.4" fill="#2b2b2b" text-anchor="start" font-style="italic">10” away, no Standard Bearer</text>
<text x="261.1" y="60.0" font-size="5.4" fill="#b4473a" text-anchor="start" font-weight="bold">Order fails: Run Token.</text>
<circle cx="253.1" cy="72.0" r="4.6" fill="#4f7f4a" stroke="#f6f1e6" stroke-width="1"/>
<text x="253.1" y="74.0" font-size="5.8" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<text x="261.1" y="74.0" font-size="5.4" fill="#2b2b2b" text-anchor="start" font-style="italic">12” away, Standard Bearer</text>
<text x="261.1" y="82.0" font-size="5.4" fill="#4f7f4a" text-anchor="start" font-weight="bold">Order succeeds.</text>
<text x="4" y="263" font-size="8" font-weight="bold" fill="#2b2b2b">The Commander</text>
<text x="4" y="274" font-size="6" fill="#2b2b2b">At the end of an allied unit’s Movement Step, the Commander can order it to make a Special Move (1” shift or one turn for</text>
<text x="4" y="282" font-size="6" fill="#2b2b2b">Closed Order, 1” toward or away from the enemy side for Open Order, 1” directly forward or backwards for Chariots and</text>
<text x="4" y="290" font-size="6" fill="#2b2b2b">Elephants), if it has no Action Token and is not Locked in Combat. Measure from the Commander’s unit: the order fails</text>
<text x="4" y="298" font-size="6" fill="#2b2b2b">beyond 6”, or beyond 18” if the chosen unit has a Standard Bearer. A failed order gives a Run Token.</text>
</svg>