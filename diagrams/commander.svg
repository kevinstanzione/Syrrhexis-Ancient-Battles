<line x1="185.7" y1="67.9" x2="185.7" y2="53.9" stroke="#3f6fb0" stroke-width="0.8"/><path d="M185.7,53.9 l7,3 l-7,3 z" fill="#3f6fb0"/>
<text x="4" y="243" font-size="8" font-weight="bold" fill="#2b2b2b">The Commander</text>
<text x="4" y="254" font-size="6" fill="#2b2b2b">At the end of an allied unit’s Movement Step, the Commander can order it to make a Special Move (1” shift or one turn for</text>
<text x="4" y="262" font-size="6" fill="#2b2b2b">Closed Order, 1” toward or away from the enemy side for Open Order), if it has no Action Token and is not Locked in Combat.</text>
<text x="4" y="270" font-size="6" fill="#2b2b2b">Measure from the Commander’s unit: the order fails beyond 6”, or beyond 18” if the chosen unit has a Standard Bearer. A</text>
<text x="4" y="278" font-size="6" fill="#2b2b2b">failed order gives a Run Token.</text>
